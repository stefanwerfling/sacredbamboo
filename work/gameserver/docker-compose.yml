version: '3.1'

services:
  sacred:
    image: sacred_gold_server
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: sacred_gold_server
    volumes:
      - sacreddata:/data
      - ./assets/server:/opt/server
    ports:
      - 2006:2006
      - 2005:2005
      - 8084:8080
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true

volumes:
  sacreddata:
    driver: local
